version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       sports_team_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 6CXL58cZ
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_team_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportmanager_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     sports_team_db
      DB_USER:     postgres
      DB_PASSWORD: 6CXL58cZ
      JWT_SECRET:  sports_team_jwt_secret_2025_xk9mq7z
      PORT:        3000
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sportmanager_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - sportmanager_network

volumes:
  pgdata:

networks:
  sportmanager_network:
    driver: bridge
